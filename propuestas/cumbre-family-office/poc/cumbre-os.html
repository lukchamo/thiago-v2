<title>Cumbre Family Office OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="PoC de entendimiento de CooWeb sobre la propuesta de Thraive para el family office de JC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: a thin PoC ribbon over an app shell (left rail of views, sticky top bar, working canvas).
   Under 900px of app width the rail becomes a phone tab bar. "Phone" view puts the same app in a 390px frame. */
:root{
  --bg:#F5F8F7; --surface:#FFFFFF; --surface-2:#EDF2F0; --surface-3:#E2EAE7;
  --ink:#0E2A2C; --ink-2:#425658; --ink-3:#5E7375;
  --line:#DBE4E1; --line-2:#C5D3CF;
  --accent:#12806B; --accent-strong:#0A5E4F; --accent-soft:#DCF0EA; --on-accent:#FFFFFF;
  --coral:#BC4F2B; --coral-soft:#FAE7DE;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --bubble-me:#D5F2E6; --wall:#E9EFEC; --plate:#FFFFFF; --frame:#0E2A2C;
  --grid:#E3EAE7; --hatch:#9FC9BD;
  --shadow-sm:0 1px 2px rgba(14,42,44,.06);
  --shadow:0 1px 2px rgba(14,42,44,.05),0 18px 40px -20px rgba(14,42,44,.28);
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-ui:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:8px; --r:12px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A1B; --surface:#112426; --surface-2:#163030; --surface-3:#1C3A39;
    --ink:#E6EFED; --ink-2:#A8BBB8; --ink-3:#8DA19F;
    --line:#22403F; --line-2:#2E5251;
    --accent:#33B898; --accent-strong:#69D3B9; --accent-soft:#143D36; --on-accent:#062019;
    --coral:#EE8B64; --coral-soft:#3B2219;
    --bubble-me:#1B4A3F; --wall:#0F2223; --plate:#FFFFFF; --frame:#020909;
    --grid:#1D3634; --hatch:#2C6E5F;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A1B; --surface:#112426; --surface-2:#163030; --surface-3:#1C3A39;
  --ink:#E6EFED; --ink-2:#A8BBB8; --ink-3:#8DA19F;
  --line:#22403F; --line-2:#2E5251;
  --accent:#33B898; --accent-strong:#69D3B9; --accent-soft:#143D36; --on-accent:#062019;
  --coral:#EE8B64; --coral-soft:#3B2219;
  --bubble-me:#1B4A3F; --wall:#0F2223; --plate:#FFFFFF; --frame:#020909;
  --grid:#1D3634; --hatch:#2C6E5F;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--surface-2)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.ic.sm{width:14px;height:14px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em}

/* ribbon */
.ribbon{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;background:var(--surface-2);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--ink-2)}
.ribbon .poc{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);border:1px solid currentColor;border-radius:4px;padding:2px 6px;flex:none}
.ribbon .msg{flex:1 1 300px;min-width:0}
.ribbon .by{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.plate{display:inline-flex;align-items:center;height:28px;padding:0 8px;background:var(--plate);border:1px solid var(--line);border-radius:7px}
.plate img{height:17px;width:auto;display:block}
.thlogo{height:28px;width:auto;border-radius:7px;display:block}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
@media (max-width:979px){.viewtoggle{display:none}}

/* stage + phone preview */
.app{background:var(--bg);position:relative}
.app-scroll{container:app/inline-size}
.stage.phone{display:flex;justify-content:center;padding-block:22px 30px;background:var(--surface-2)}
.stage.phone .app{width:392px;height:min(820px,calc(100vh - 150px));min-height:560px;border-radius:46px;border:11px solid var(--frame);box-shadow:var(--shadow);overflow:hidden;transform:translateZ(0)}
.stage.phone .app-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage.phone .topbar{top:0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .mark{width:32px;height:32px;display:block}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.search{position:relative;flex:1 1 auto;max-width:460px;margin-left:16px;min-width:0}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search>.ic{position:absolute;left:11px;top:10px;color:var(--ink-3)}
.sres{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:50;max-height:380px;overflow:auto}
.sres button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:8px}
.sres button:hover,.sres button:focus-visible{background:var(--surface-2)}
.sres .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);width:84px;flex:none}
.sres .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres .empty{padding:10px;color:var(--ink-3)}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.daychip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.daychip span{font-size:12.5px;font-weight:600}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.iconbtn:hover{background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:59px;align-self:start;max-height:calc(100vh - 59px);overflow:auto;padding:18px 14px 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.stage.phone .rail{top:0}
.rail .grp{display:flex;flex-direction:column;gap:2px}
.rail .grp .eyebrow{padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink-2);font-weight:500;width:100%}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:600}
.nav[aria-current="page"] .ic{color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;min-width:22px;height:20px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.nav .cnt.hot{background:var(--coral-soft);color:var(--coral)}
.nav .p2{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;color:var(--coral);letter-spacing:.08em}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 10px}
.linkbtn{color:var(--ink-3);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
main{padding:24px 0 72px 26px;min-width:0;outline:none}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-family:var(--f-display);font-size:34px;line-height:1.08;font-weight:500;letter-spacing:-.015em}
.ph .lede{color:var(--ink-2);max-width:62ch;margin-top:6px}
.ph .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.phase{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong)}
.phase.p2{background:var(--coral-soft);color:var(--coral)}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:650;font-family:var(--f-ui)}
.card h2 .muted{font-weight:500}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g-21{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.mt{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent-strong)}
.chip.cor{background:var(--coral-soft);color:var(--coral)}
.mono-tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.cli{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.cli i{font-style:normal;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.02em;background:var(--ink);color:var(--bg)}
.cli.all i{background:var(--surface-3);color:var(--ink-2)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warning)} .dot.crit{background:var(--critical)} .dot.idle{background:var(--line-2)}
.ro{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-strong);border:1px solid var(--accent);border-radius:999px;padding:2px 8px}
.empty-note{color:var(--ink-3);font-size:13px;padding:8px 0}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.row-title{font-weight:600;line-height:1.3}
.row-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink-3)}
.row.hot{position:relative;padding-left:12px}
.row.hot::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--coral)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.due.is-hot{color:var(--coral);font-weight:600}

/* today */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:20px}
.hero h1{font-family:var(--f-display);font-size:44px;line-height:1.02;font-weight:500;letter-spacing:-.02em}
.hero .brief{font-family:var(--f-display);font-size:19px;line-height:1.5;color:var(--ink-2);max-width:66ch}
.hero .brief b{color:var(--ink);font-weight:600}
.pulse{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pulse button{display:flex;align-items:baseline;gap:7px;padding:9px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pulse button:hover{border-color:var(--line-2)}
.pulse b{font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pulse .hot b{color:var(--coral)}
.glance .big{font-family:var(--f-display);font-size:34px;font-weight:500;letter-spacing:-.01em;line-height:1.1}
.kv{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* board */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--r-lg);padding:10px;min-height:220px;display:flex;flex-direction:column;gap:8px;transition:outline-color .15s}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col>header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 4px}
.col>header b{font-size:13px}
.col>header span{font-size:11.5px;color:var(--ink-3)}
.col .hint{font-size:11.5px;color:var(--ink-3);padding:0 4px 2px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;cursor:grab;text-align:left;width:100%}
.tk:hover{border-color:var(--line-2)}
.tk.dragging{opacity:.45}
.tk .t{font-weight:600;line-height:1.3;font-size:13.5px}
.tk .m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink-3)}
.tk.fresh{animation:pop .9s ease-out}
.tk.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.tk .acts{display:flex;gap:6px}
@keyframes pop{0%{box-shadow:0 0 0 0 var(--accent)}40%{box-shadow:0 0 0 5px var(--accent-soft)}100%{box-shadow:var(--shadow-sm)}}

/* drawer + sheet */
.scrim{position:fixed;inset:0;background:rgba(5,20,20,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:90;transform:translateX(104%);transition:transform .25s ease;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:16px;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer h2{font-family:var(--f-display);font-size:25px;line-height:1.15;font-weight:500}
.drawer .close{position:absolute;top:14px;right:max(14px,env(safe-area-inset-right,0px))}
.facts{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13px}
.facts dt{color:var(--ink-3)} .facts dd{margin:0;font-weight:500;min-width:0}
.movebar{display:flex;flex-wrap:wrap;gap:6px}
.log li{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log time{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:62px;flex:none;padding-top:1px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.sheet .grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;background:var(--surface-2);font-size:12.5px;font-weight:600;text-align:center}

/* tab bar (phone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;justify-content:space-around;align-items:flex-end;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-3);padding:4px 6px;min-width:56px;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent-strong)}
.tabbar .fab{width:46px;height:46px;border-radius:15px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow)}
.tabbar .bdg{position:absolute;top:0;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--coral);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px}

/* toast + tooltip */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:120;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;z-index:130;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12px;pointer-events:none;max-width:260px}
.tip b{display:block;font-size:12.5px;margin-bottom:2px}

/* capture */
.cap{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:24px;align-items:start}
.phonebox{background:var(--frame);border-radius:40px;padding:10px;box-shadow:var(--shadow)}
.phonescreen{background:var(--wall);border-radius:31px;overflow:hidden;display:flex;flex-direction:column;height:620px}
.wa-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.wa-head .mark{width:34px;height:34px;flex:none;display:block}
.wa-head b{display:block;font-size:14px}
.wa-head small{font-size:11.5px;color:var(--accent-strong)}
.wa-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:8px 11px;border-radius:14px;font-size:13.5px;line-height:1.4;box-shadow:var(--shadow-sm);overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--bubble-me);border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
.bub time{display:block;text-align:right;font-size:10px;color:var(--ink-3);margin-top:3px}
.capcard{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.capcard .t{font-weight:600;font-size:13px}
.capcard .m{display:flex;flex-wrap:wrap;gap:5px}
.capcard .a{display:flex;gap:6px;flex-wrap:wrap}
.tries{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;scrollbar-width:none}
.tries button{flex:none;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-input{display:flex;gap:8px;padding:10px;align-items:center}
.wa-input input{flex:1;min-width:0;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:none}
.wa-input input:focus{border-color:var(--accent)}
.sendbtn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.step i{font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500}
.step p{color:var(--ink-2);font-size:13px}
.step b{display:block;color:var(--ink);font-size:13.5px}
.channels{display:flex;flex-wrap:wrap;gap:6px}

/* assistant */
.asst{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.thread{display:flex;flex-direction:column;gap:12px;min-height:280px}
.msg{max-width:min(620px,92%);border-radius:16px;padding:12px 14px;line-height:1.5;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px;font-weight:500}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.ai ul{margin:8px 0 2px;display:flex;flex-direction:column;gap:5px}
.msg.ai li{display:flex;gap:8px}
.msg.ai li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}
.msg .src{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.msg .ronote{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.msg .free{white-space:pre-wrap}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--ink-3)}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.thinking span:nth-child(2){animation-delay:.2s}.thinking span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.draft{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.draft .subj{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.draft pre{margin:0;padding:12px;font-family:var(--f-ui);font-size:13.5px;white-space:pre-wrap;line-height:1.55}
.draft .a{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface);align-items:center}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sugg button{padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;text-align:left}
.sugg button:hover{border-color:var(--accent);color:var(--accent-strong)}
.composer{position:sticky;bottom:12px;margin-top:14px;display:flex;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.composer input{flex:1;min-width:0;border:0;background:none;padding:0 10px;outline:none;height:40px}
.can li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13px}
.can li .ic{color:var(--accent);margin-top:1px}
.can.no li .ic{color:var(--ink-3)}

/* money */
.scopebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.hub{display:grid;grid-template-columns:minmax(0,1fr) 220px minmax(0,1fr);gap:16px;align-items:center}
.hub-side{display:flex;flex-direction:column;gap:9px}
.hub-row{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hub-row .lbl{color:var(--ink-2);font-weight:500}
.hub-row .val{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;min-width:82px}
.hub-row .val small{display:block;font-size:11px;font-weight:500;color:var(--ink-3)}
.bar{height:10px;border-radius:0 4px 4px 0;background:var(--surface-2);position:relative;overflow:hidden}
.bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.bar .in{background:var(--accent)} .bar .out{background:var(--coral)}
.bar .exp{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px);border-radius:0 4px 4px 0}
.out-side .bar .exp{background-image:repeating-linear-gradient(135deg,var(--coral-soft) 0 3px,transparent 3px 6px);border:1px solid var(--coral);border-left:0}
.hub-core{aspect-ratio:1;max-width:220px;width:100%;margin:auto;border-radius:50%;border:1.5px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;background:var(--surface);box-shadow:0 0 0 10px var(--accent-soft)}
.hub-core .big{font-family:var(--f-display);font-size:32px;font-weight:500;line-height:1.05;letter-spacing:-.01em}
.hub-core small{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.35}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-3);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.legend .sw-a{background:var(--accent)} .legend .sw-e{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px);border:1px solid var(--accent)}
.legend .ln-a{height:2px;background:var(--accent)} .legend .ln-e{height:0;border-top:2px dashed var(--accent)}
.budget{display:flex;flex-direction:column;gap:12px}
.bud .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.bud .top b{font-weight:600}
.bud .track{position:relative;height:10px;background:var(--surface-2);border-radius:5px;overflow:visible}
.bud .track>span{position:absolute;top:0;bottom:0;left:0;border-radius:5px 0 0 5px}
.bud .track .a{background:var(--ink-2)}
.bud .track .e{background-image:repeating-linear-gradient(135deg,var(--line-2) 0 3px,transparent 3px 6px)}
.bud .track .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.bud .note{margin-top:5px;font-size:12px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td.amt.pos{color:var(--accent-strong)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick input{flex:1 1 260px;min-width:0;height:40px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--surface);outline:none}
.quick input:focus{border-color:var(--accent)}
.parsed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px;margin-top:10px;font-size:12.5px;color:var(--ink-3)}

/* charts */
.chart{width:100%;min-height:60px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .tk-l{fill:var(--ink-3);font-family:var(--f-ui);font-size:11px;font-variant-numeric:tabular-nums}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.e{stroke-dasharray:5 5}
.chart .ar{fill:var(--accent);opacity:.1}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.chart .hd{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .hover-layer{opacity:0;transition:opacity .1s}
.chart.hovering .hover-layer{opacity:1}
.chart .today-l{stroke:var(--coral);stroke-width:1}
.chart .today-t{fill:var(--coral);font-family:var(--f-mono);font-size:10px;letter-spacing:.08em}
.chart .pt1{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .pt2{fill:var(--coral);stroke:var(--surface);stroke-width:2}
.chart .pl{fill:var(--ink);font-family:var(--f-ui);font-size:11.5px;font-weight:600}
.chart .q{fill:var(--accent-soft);opacity:.7}
.chart .ql{fill:var(--accent-strong);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em}
.chart .ax{fill:var(--ink-3);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em}

/* documents */
.docs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.inbox-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.mail{display:flex;gap:12px;padding:12px;border-radius:12px;width:100%;text-align:left;align-items:flex-start;border:1px solid transparent}
.mail:hover{background:var(--surface-2)}
.mail[aria-current="true"]{background:var(--surface-2);border-color:var(--line)}
.mail .ico{width:34px;height:34px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-2);flex:none}
.mail .b{min-width:0;flex:1}
.mail .f{font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.mail .s{font-weight:600;line-height:1.3;margin:2px 0 6px}
.pipe{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pipe span{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-3)}
.pipe span.on{color:var(--accent-strong)}
.pipe span.cur{color:var(--coral)}
.pipe .sep{width:10px;height:1px;background:var(--line-2)}
.steps-big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 16px}
.steps-big div{padding:10px;border-radius:10px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.steps-big div.on{background:var(--accent-soft);color:var(--accent-strong)}
.steps-big div.cur{background:var(--coral-soft);color:var(--coral)}
.path{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);background:var(--surface-2);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere}
.except{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--coral-soft);color:var(--ink);font-size:13px;margin-top:12px}
.except .ic{color:var(--coral)}

/* calendar */
.cal{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .wd{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:4px 6px}
.day{min-height:86px;border-radius:10px;background:var(--surface-2);padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid transparent;min-width:0}
.day:hover{border-color:var(--line-2)}
.day.blank{background:none;pointer-events:none}
.day .n{font-size:12px;font-weight:700;color:var(--ink-2)}
.day.past .n{color:var(--ink-3);font-weight:500}
.day.today{background:var(--surface);border-color:var(--coral)}
.day.today .n{color:var(--coral)}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px}
.ev{font-size:10.5px;line-height:1.25;padding:2px 5px;border-radius:5px;background:var(--surface);color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:3px solid var(--line-2)}
.ev.in{border-left-color:var(--accent)} .ev.out{border-left-color:var(--coral)} .ev.task{border-left-color:var(--ink)} .ev.event{border-left-color:var(--warning)}
.agenda li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.agenda li:first-child{border-top:0}
.agenda .when{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:74px;flex:none;padding-top:2px}
.kind{width:8px;height:8px;border-radius:2px;margin-top:6px;flex:none;background:var(--line-2)}
.kind.in{background:var(--accent)} .kind.out{background:var(--coral)} .kind.task{background:var(--ink)} .kind.event{background:var(--warning)}
.learn{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.learn:first-child{border-top:0}
.learn .ic{color:var(--accent);margin-top:2px}
.learn small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}

/* kyc */
.kyc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.cp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px;border-radius:12px;width:100%;text-align:left;border:1px solid transparent}
.cp:hover{background:var(--surface-2)}
.cp[aria-current="true"]{background:var(--surface-2);border-color:var(--line)}
.cp b{font-weight:650}
.cp .sub{font-size:12px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.checks li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.checks li:first-child{border-top:0}
.ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;border:1.5px solid var(--line-2);color:transparent}
.ck.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ck.run{border-color:var(--coral);border-style:dashed}
.newcp{display:flex;gap:8px;margin-top:12px}
.newcp input{flex:1;min-width:0;height:36px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--surface);outline:none}

/* wealth */
.p2band{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--coral-soft);margin-bottom:16px;font-size:13.5px}
.p2band .ic{color:var(--coral);margin-top:1px}
.nw{font-family:var(--f-display);font-size:46px;font-weight:500;letter-spacing:-.02em;line-height:1}
.delta{color:var(--accent-strong);font-weight:700;font-size:14px}
.hbar{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar .v{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;min-width:72px}
.hbar .bar>span{background:var(--accent)}
.hbar .bar.nb>span{background:var(--ink-2)}
.feed li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed .ico{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.feed small{display:block;color:var(--ink-3);font-size:12px}

/* security */
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pillar{padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.pillar .ic{color:var(--accent);width:22px;height:22px}
.pillar b{font-size:14px}
.pillar p{font-size:13px;color:var(--ink-2)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.perm{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.perm.full{background:var(--accent-soft);color:var(--accent-strong)}
.perm.none{background:none;color:var(--ink-3)}
.perm.rd{background:var(--surface-3);color:var(--ink)}
.matrix th.sel,.matrix td.sel{background:var(--surface-2)}
.seen li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.seen li:first-child{border-top:0}
.seen .ic{color:var(--accent)}
.seen .off{color:var(--ink-3)}
.seen .off .ic{color:var(--ink-3)}

/* plan */
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.phasecard{padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.phasecard.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.phasecard h3{font-family:var(--f-display);font-size:22px;font-weight:500}
.phasecard ul li{display:flex;gap:8px;font-size:13px;padding:3px 0;color:var(--ink-2)}
.phasecard ul li .ic{color:var(--accent);margin-top:1px}
.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.role{padding:14px;border-radius:14px;background:var(--surface-2);display:flex;gap:12px;align-items:flex-start}
.role .ic{width:22px;height:22px;color:var(--accent-strong);margin-top:2px}
.role b{display:block;font-size:14px}
.role p{font-size:13px;color:var(--ink-2);margin-top:3px}
.stackchips{display:flex;flex-wrap:wrap;gap:6px}
.stackchips span{font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.stackchips span.p2{border-style:dashed;color:var(--ink-3)}
.cadence{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cadence div{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px}
.cadence b{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:2px}

.msearch{display:none !important}
.day .dots{display:none;gap:3px;flex-wrap:wrap}
.day .dots i{width:6px;height:6px;border-radius:2px;background:var(--line-2)}
.day .dots i.in{background:var(--accent)} .day .dots i.out{background:var(--coral)} .day .dots i.task{background:var(--ink)} .day .dots i.event{background:var(--warning)}
/* fixed layers live outside the container, so they follow a class set from the app width */
.app.narrow .tabbar{display:flex}
.app.narrow .drawer{top:auto;left:0;width:100%;max-height:86%;border-left:0;border-radius:18px 18px 0 0;transform:translateY(104%)}
.app.narrow .drawer.open{transform:none}
/* responsive (container: app width) */
@container app (max-width: 1180px){
  .asst{grid-template-columns:minmax(0,1fr)}
  .asst aside{display:none}
  .hub{grid-template-columns:minmax(0,1fr)}
  .hub-core{max-width:190px;order:-1}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pillars{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container app (max-width: 900px){

function usdK(n, signed){
  const a = Math.abs(n), s = n < 0 ? "−" : (signed && n > 0 ? "+" : "");

}

/* ───────────── money math ───────────── */
const isIn = cat => IN_CATS.includes(cat);
const sgn = x => isIn(x.cat) ? x.amt : -x.amt;
function txOf(scope){ return state.tx.filter(x => scope === "all" || x.hh === scope); }
function money(scope){
  const r = {cat:{}, inA:0, inE:0, outA:0, outE:0};
  IN_CATS.concat(OUT_CATS).forEach(c => r.cat[c] = {a:0, e:0});
  txOf(scope).forEach(x => {
    r.cat[x.cat][x.st] += x.amt;
    if (isIn(x.cat)) { x.st === "a" ? r.inA += x.amt : r.inE += x.amt; }
    else { x.st === "a" ? r.outA += x.amt : r.outE += x.amt; }
  });
  r.inT = r.inA + r.inE; r.outT = r.outA + r.outE;
  r.netA = r.inA - r.outA; r.net = r.inT - r.outT;
  return r;
}
function budgetOf(scope){
  const b = {taxes:0, debt:0, lifestyle:0, invest:0};
  Object.keys(BUDGET).forEach(h => { if (scope === "all" || scope === h) OUT_CATS.forEach(c => b[c] += BUDGET[h][c]); });
  return b;
}

/* capture parsing (rule-based; the live assistant takes over free text when available) */
const WD = {sunday:0,domingo:0,monday:1,lunes:1,tuesday:2,martes:2,wednesday:3,miercoles:3,thursday:4,jueves:4,friday:5,viernes:5,saturday:6,sabado:6};
function parseDue(s){
  if (/\b(today|hoy)\b/.test(s)) return TODAY;
  if (/\b(tomorrow|manana)\b/.test(s) && !/(por|en) la manana/.test(s)) return addDays(TODAY,1);
  if (/\b(next week|proxima semana|semana que viene)\b/.test(s)) return addDays(TODAY,7);
  for (const w in WD){
    if (new RegExp("\\b" + w + "\\b").test(s)){
      let diff = (WD[w] - 2 + 7) % 7; if (diff === 0) diff = 7;
      return addDays(TODAY, diff);
    }
  }
  const m = s.match(/\b(\d{1,2})(st|nd|rd|th)\b/) || s.match(/\bel (\d{1,2})\b/);
  if (m){ const d = +m[1]; if (d >= 1 && d <= 31) return d >= TODAY_DAY ? julyIso(d) : "2026-08-" + String(d).padStart(2,"0"); }
  return null;
}
function catOf(s){
  if (/(tax|irs|impuest)/.test(s)) return "taxes";
  if (/(mortgage|loan|hipotec|prestamo)/.test(s)) return "debt";
  if (/(fund|capital call|brokerage|invest|inversion|fondo)/.test(s)) return "invest";
  return "lifestyle";
}
function cleanTitle(raw){
  let s = raw.trim();
  s = s.replace(/^(please\s+)?remind me(\s+on|\s+to)?\s*/i, "").replace(/^(por favor\s+)?recu[eé]rdame\s*/i, "");
  s = s.replace(/^idea\s*:?\s*/i, "");
  s = s.replace(/^(i\s+)?(spent|paid)\s+\$?[\d.,]+\s+(on\s+)?/i, "").replace(/^(gast[eé]|pagu[eé])\s+\$?[\d.,]+\s+(en\s+)?/i, "");
  s = s.replace(/\s*[,—–-]?\s*(follow up|follow-up|dale seguimiento|haz seguimiento|hazle seguimiento)\b.*$/i, "");
  s = s.replace(/\b(on\s+|this\s+|next\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b\s*/ig, "");
  s = s.replace(/\b(el\s+)?(pr[oó]ximo\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b\s*/ig, "");
  s = s.replace(/\b(today|tomorrow|hoy|ma[nñ]ana)\b\s*/ig, "");
  s = s.replace(/,\s*(reyes|alm[aá]nzar|batista)\s*$/i, "");
  s = s.replace(/^(to|que)\s+/i, "").replace(/\s{2,}/g, " ").replace(/[\s,.;:—–-]+$/, "").trim();
  if (!s) s = raw.trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function parseCapture(raw){
  const s = norm(raw);
  const r = {kind:"ticket", title:"", client:null, column:"todo", due:null, party:null, amount:null, category:null};
  if (/reyes/.test(s)) r.client = "reyes"; else if (/almanzar/.test(s)) r.client = "almanzar"; else if (/batista/.test(s)) r.client = "batista";
  const P = [["lisa",/\blisa\b|\bcpa\b|contador|accountant/],["ortega",/ortega|abogad|lawyer/],["harbor",/harbor|\bbank\b|\bbanco\b/],["meridian",/meridian|insurance|seguro/],["agent",/\bagent|\bagente|diamond line/],["costa",/costa builders|contractor|contratista/]];
  for (const [k, re] of P) if (re.test(s)){ r.party = k; break; }
  const am = s.match(/\$?\s?(\d{1,3}(?:[.,]\d{3})+|\d{2,})(?![\d-])/);
  if (/^idea\b/.test(s)){ r.kind = "idea"; r.column = "inbox"; }
  else if (am && /(spent|spend|paid|gaste|pague|gasto|expense|cost)/.test(s)){ r.kind = "expense"; r.amount = parseInt(am[1].replace(/[.,]/g,""), 10); r.category = catOf(s); }
  else if (/(follow up|follow-up|still|waiting|hasn.?t|owes|seguimiento|todavia|nos debe|esperando)/.test(s)) r.column = "waiting";
  r.due = parseDue(s);
  r.title = cleanTitle(raw);
  return r;
}

function intentOf(q){
  const s = norm(q);
  const cl = /reyes/.test(s) ? "reyes" : /almanzar/.test(s) ? "almanzar" : /batista/.test(s) ? "batista" : null;
  const party = Object.keys(PARTIES).find(k => s.includes(norm(PARTIES[k].first)) || s.includes(norm(PARTIES[k].name.split(",")[0])));
  if (/(draft|redact|borrador|escrib|write)/.test(s)){
    if (/(bank|banco|wire|transfer|aprob|approv|solaris)/.test(s)) return ["draft","bank"];
    const w = byCol("waiting").find(x => (party && x.party === party) || (cl && x.c === cl));
    if (w) return ["nudge", w.id];
  }
  if (/(legal|abogad|lawyer|attorney)/.test(s)) return ["legal"];
  if (party && /(wait|esper|open|abiert|pend|owe|debe)/.test(s)) return ["party", party];
  if (cl && /(open|abiert|pend|what.?s up|que hay|status|estado)/.test(s)) return ["open", cl];
  if (/(waiting|esperando|esperan)/.test(s)) return ["waiting"];
  if (/(this week|esta semana|due|vence|vencen|upcoming|proxim)/.test(s)) return ["week"];
  if (/(cash|flujo|net position|posicion neta|money|dinero|caja)/.test(s)) return ["cash"];
  if (/(statement|extracto|gentros)/.test(s)) return ["statement"];
  return null;
}

function niceTicks(min, max, n){

  const out = []; for (let v = Math.floor(min / step) * step; v < max + step - 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

function go(view){
  state.view = view; closeAll();

function moveTicket(id, col){

function searchIndex(){
  const R = [];
  state.tickets.forEach(x => R.push({k:"k_ticket", label:tr(x.title), hay:tr(x.title) + " " + clientName(x.c) + " " + (x.party ? PARTIES[x.party].name : ""), act:["open-ticket", x.id]}));
  state.docs.forEach(d => R.push({k:"k_doc", label:tr(d.subj), hay:tr(d.subj) + " " + d.from + " " + d.folder, act:["open-doc", d.id]}));
  Object.entries(CLIENTS).forEach(([k, c]) => R.push({k:"k_client", label:c.name + " · " + c.person, hay:c.name + " " + c.person, act:["ask-client", k]}));
  Object.entries(PARTIES).forEach(([k, p]) => R.push({k:"k_party", label:p.name + " · " + tr(p.kind), hay:p.name + " " + tr(p.kind), act:["ask-party", k]}));
  state.kyc.forEach(k => R.push({k:"k_kyc", label:k.name, hay:k.name + " " + tr(k.kind), act:["open-kyc", k.id]}));
  EV0.forEach(e => R.push({k:"k_event", label:tr(e.title) + " · " + fmtD(e.d), hay:tr(e.title), act:["day-go", e.d]}));
  state.tx.forEach(x => R.push({k:"k_tx", label:tr(x.desc) + " · " + usd(x.amt), hay:tr(x.desc) + " " + CLIENTS[x.hh].name, act:["go-money", x.hh]}));
  return R;
}
function doSearch(q){
  const box = $("#sres"); if (!box) return;
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!toks.length){ box.hidden = true; return; }
  const res = searchIndex().filter(r => { const h = norm(r.hay); return toks.every(tk2 => h.includes(tk2)); }).slice(0, 8);
  box.innerHTML = res.length ? res.map(r => `<button data-act="sres" data-a="${r.act[0]}" data-id="${esc(r.act[1])}"><span class="k">${esc(t(r.k))}</span><span class="tx">${esc(r.label)}</span></button>`).join("") : `<div class="empty">${esc(t("noResults"))}</div>`;
  box.hidden = false;
}

  "ask-party":el => { pushAnswer(["party", el.dataset.id], (L === "es" ? "¿Qué está pendiente con " : "What's open with ") + PARTIES[el.dataset.id].name + "?"); go("assistant"); },
  "stop":() => { if (CTL) CTL.abort(); },
  "copy":el => {
    const pre = document.getElementById("draft-" + el.dataset.id); if (!pre) return;
    const text = pre.textContent;
    const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t("copyFail")); };
    try { navigator.clipboard.writeText(text).then(() => toast(t("copied")), sel); } catch(e){ sel(); }
  },
  "tone":el => { const m = state.asst.find(x => x.id === +el.dataset.id); if (m){ m.v = m.v ? 0 : 1; render(); } },

function scrollThread(){ const th = $("#thread"); if (th && th.lastElementChild) th.lastElementChild.scrollIntoView({block:"nearest", behavior:"smooth"}); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el){ if (!e.target.closest("#searchbox")){ const b = $("#sres"); if (b) b.hidden = true; } return; }
  if (el.tagName === "FORM") return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.closest(".tk") && el.dataset.act !== "open-ticket") e.stopPropagation();
  fn(el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeAll(); const b = $("#sres"); if (b) b.hidden = true; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); const q = $("#q"); if (q){ $("#searchbox").classList.add("show"); q.focus(); } }
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("tk")) openDrawer(e.target.dataset.id);
  if (e.key === "Enter" && e.target.id === "q"){ const f = document.querySelector("#sres button"); if (f){ e.preventDefault(); f.click(); } }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") doSearch(e.target.value);
  if (e.target.id === "expin") expPreview(e.target.value);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "cap"){ const i = $("#capin"); const v = i.value; i.value = ""; capSend(v, true); }
  if (f === "ask"){ const i = $("#askin"); const v = i.value; i.value = ""; ask(v); scrollThread(); }
  if (f === "exp"){ const i = $("#expin"); const v = i.value; if (v.trim()){ i.value = ""; addExpense(v); } }
  if (f === "kyc"){
    const i = $("#kycin"), v = i.value.trim(); if (!v) return;
    const id = "k" + (++state.seq);
    state.kyc.unshift({id, name:v, kind:{en:"New counterparty", es:"Contraparte nueva"}, status:"review", checked:null, next:null, used:["all"], items:[0,0,0,0,0,0]});

});

let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-drag]"); if (!c) return; dragId = c.dataset.drag; c.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch(x) {} });
document.addEventListener("dragend", e => { const c = e.target.closest && e.target.closest("[data-drag]"); if (c) c.classList.remove("dragging"); document.querySelectorAll(".col.drop").forEach(x => x.classList.remove("drop")); });
document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest("[data-drop]"); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach(x => { if (x !== col) x.classList.remove("drop"); }); col.classList.add("drop"); });
document.addEventListener("drop", e => { const col = e.target.closest && e.target.closest("[data-drop]"); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; col.classList.remove("drop"); moveTicket(id, col.dataset.drop); });
/* chart hover */
document.addEventListener("pointermove", e => { if (e.target.closest && e.target.closest(".chart[data-chart]")) chartHover(e); else if (!$("#tip").hidden){ chartLeave(e); } });
document.addEventListener("pointerleave", chartLeave, true);
let rzT; let lastW = 0;
window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (window.innerWidth < 980 && stagePhone()){ $("#stage").classList.remove("phone"); render(); return; } const w = $("#main").clientWidth; if (Math.abs(w - lastW) > 30){ lastW = w; drawCharts(); } }, 180); });

/* ───────────── boot ───────────── */
(function boot(){
  const saved = store.get("lang");
  L = saved === "es" || saved === "en" ? saved : ((navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en");
  const th = store.get("theme");
  document.documentElement.dataset.theme = th === "dark" ? "dark" : "light";
  const h = (location.hash || "").slice(1);
  if (VIEW_FN[h]) state.view = h;
  const app = $("#app");
  const syncW = () => app.classList.toggle("narrow", app.clientWidth <= 900);
  syncW();
  if (window.ResizeObserver) new ResizeObserver(syncW).observe(app); else window.addEventListener("resize", syncW);
  render(); lastW = $("#main").clientWidth;
  (async () => {
    try {
      if (window.claude && typeof window.claude.use === "function"){
        const s = await window.claude.use("sample");
        if (typeof s === "function"){ AI = s; }
      }
    } catch(e){ AI = null; }
    aiReady = true;
    if (state.view === "assistant") render();
  })();
})();
</script>
